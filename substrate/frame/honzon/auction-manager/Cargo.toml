[package]
name = "pallet-auction-manager"
version = "1.0.0"
authors = ["Acala Developers"]
edition = { workspace = true }

[dependencies]
codec = { workspace = true, features = ["derive"] }
frame-support = { workspace = true }
frame-system = { workspace = true }
log = { workspace = true }
pallet-auction = { workspace = true }
pallet-balances = { workspace = true }
scale-info = { workspace = true }
sp-io = { workspace = true }
sp-runtime = { workspace = true }
sp-std = { workspace = true }

[dev-dependencies]
pallet-asset-conversion = { workspace = true }
pallet-assets = { workspace = true }
pallet-assets-freezer = { workspace = true }
pallet-assets-holder = { workspace = true }
pallet-balances = { workspace = true }
pallet-cdp-treasury = { workspace = true }
serde = { workspace = true }
sp-core = { workspace = true }


[features]
default = ["std"]
std = [
	"codec/std",
	"frame-support/std",
	"frame-system/std",
	"log/std",
	"pallet-asset-conversion/std",
	"pallet-assets-freezer/std",
	"pallet-assets-holder/std",
	"pallet-assets/std",
	"pallet-auction/std",
	"pallet-balances/std",
	"pallet-cdp-treasury/std",
	"scale-info/std",
	"serde/std",
	"sp-core/std",
	"sp-io/std",
	"sp-runtime/std",
	"sp-std/std",
]
try-runtime = [
	"frame-support/try-runtime",
	"frame-system/try-runtime",
	"pallet-asset-conversion/try-runtime",
	"pallet-assets/try-runtime",
	"pallet-assets-freezer/try-runtime",
	"pallet-assets-holder/try-runtime",
	"pallet-auction/try-runtime",
	"pallet-balances/try-runtime",
	"pallet-cdp-treasury/try-runtime",
	"sp-runtime/try-runtime"
]
